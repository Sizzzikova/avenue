# Конфигурация бота-автопостинга акций «Авеню».
#
# Правки селекторов при редизайне сайта делаются здесь, без изменения кода.
# Подробности — в README.md, раздел «Что делать, если сайт переверстали».

cities:
  - key: nsk
    name: Новосибирск
    # Предложный падеж для заголовка поста: «Авто со скидкой в Новосибирске»
    name_in: Новосибирске
    base_url: https://avenuerent.ru
    promos_path: /aktcii/

  - key: irkutsk
    name: Иркутск
    name_in: Иркутске
    base_url: https://irkutsk.avenuerent.ru
    promos_path: /aktcii/

  - key: gorno-altaysk
    name: Горно-Алтайск
    name_in: Горно-Алтайске
    base_url: https://gorno-altaysk.avenuerent.ru
    promos_path: /aktcii/

# CSS-селекторы карточки автомобиля со скидкой на странице /aktcii/.
selectors:
  # Корень карточки. Каждое совпадение = одна акция.
  card: div.cars__item.js-car-data
  # Ссылка с названием автомобиля внутри карточки.
  title_link: span.cars__item__bg p a
  # Служебная ссылка с data-атрибутами (id авто, даты действия скидки).
  data_anchor: .colors a[data-car]
  # Картинки автомобиля (берётся первая).
  image: .cars-image-slider img
  # Плашки «Новинка», «Правый руль» и т.п.
  labels: .detail-link-labels div
  # Тип кузова.
  body_type: p.car_item_p a
  # Привод / коробка / мощность / объём — распознаются по содержимому.
  properties: p.car_item_p .property_auto_block
  # Год выпуска.
  year: p.car_item_p .year

http:
  timeout_seconds: 30
  retries: 3
  # Пауза между попытками растёт экспоненциально: 2, 4, 8 секунд.
  backoff_seconds: 2
  user_agent: >-
    Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36

prices:
  # Цены на странице подставляются джаваскриптом, в HTML лежит «#N/A».
  # Настоящая цена и размер скидки берутся из того же ajax-эндпоинта,
  # которым пользуется сайт. Если выключить — в пост попадёт базовая цена
  # из атрибута static-price, без процента скидки.
  enabled: true
  path: /ajax/calc_catalog.php

messengers:
  telegram:
    enabled: true
    # Пауза после отправки, чтобы не упереться в лимиты API.
    delay_seconds: 1.0
  max:
    # Включить после регистрации бота в business.max.ru и добавления
    # секретов MAX_BOT_TOKEN / MAX_CHAT_ID.
    enabled: false
    api_url: https://platform-api.max.ru
    delay_seconds: 1.0

state:
  path: state/seen.json

post:
  # digest   — один пост в сутки со всеми изменениями сразу. Если за сутки
  #            ничего не появилось и не подешевело, пост не выходит вообще.
  #            Когда изменение всего одно, пост выходит обычным — с фото авто.
  # separate — отдельный пост на каждый автомобиль (пять новых авто = пять постов).
  mode: digest

  # Учитывать ли подешевевшие автомобили, а не только впервые появившиеся.
  # true  — авто, у которого упала цена, попадёт в дайджест в раздел
  #         «обновились цены» (в режиме separate — выйдет отдельным постом).
  # false — изменение цены проходит молча, в канал попадают только новинки.
  include_changes: true

  # Насколько должна упасть цена, чтобы это стало поводом для поста, в процентах.
  # Цены отдаёт живой калькулятор сайта, и они колеблются сами по себе; без
  # порога бот писал бы «цены снизились» чуть ли не каждый день.
  # Поставьте больше (10–15), если постов про снижение всё равно много.
  price_drop_percent: 5
